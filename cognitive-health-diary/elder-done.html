<!DOCTYPE html>

<html class="w-full h-full overflow-hidden" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>录好了</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
  html, body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; -webkit-tap-highlight-color: transparent; }
  .no-sb { scrollbar-width: none; -ms-overflow-style: none; }
  .no-sb::-webkit-scrollbar { display: none; width: 0; height: 0; }
  @keyframes popIn { 0% { transform: scale(0.7); opacity: 0; } 60% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
  .pop-in { animation: popIn .6s ease-out; }
  @keyframes waveUp { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
  .wave-up { animation: waveUp 1s ease-in-out infinite; transform-origin: center; }
</style>
</head>
<body class="w-full h-full m-0 overflow-hidden flex items-center justify-center bg-[#DCE0E5]">
<div class="relative w-full h-full max-w-[393px] max-h-[852px] bg-[#FBF8F3] overflow-hidden flex flex-col">
<div class="flex-1 min-h-0 overflow-y-auto no-sb px-5 flex flex-col">
<div class="pt-16 flex flex-col items-center shrink-0">
<div class="pop-in w-[120px] h-[120px] rounded-full bg-[#E6F4EF] flex items-center justify-center">
<div class="w-[92px] h-[92px] rounded-full bg-[#0F8A7E] flex items-center justify-center">
<iconify-icon class="text-[52px] text-white" icon="solar:check-read-linear"></iconify-icon>
</div>
</div>
<h1 class="mt-7 text-[26px] font-semibold text-[#2C3742]">说完了，收到啦</h1>
<p class="mt-3 text-[19px] leading-relaxed text-center text-[#5B6470]">
          刚才这一段已经好好存起来了，家里人想听的时候就能听到。
        </p>
</div>
<div class="mt-8 rounded-3xl bg-white border border-[#EDE7DD] p-5 shrink-0">
<div class="flex items-center gap-3">
<button class="w-[56px] h-[56px] rounded-full bg-[#0F8A7E] flex items-center justify-center text-white shrink-0 active:bg-[#0B6B62]" id="playBtn" onclick="togglePlay()">
<iconify-icon class="text-[26px]" icon="solar:play-linear" id="playIcon"></iconify-icon>
</button>
<div class="flex-1">
<p class="text-[18px] font-medium text-[#2C3742]">听听刚才这一段</p>
<div class="mt-2 flex items-end gap-[3px] h-[26px]" id="waveBox">
<span class="wave-up w-[4px] h-[6px] rounded-full bg-[#B7CFC9]"></span>
<span class="wave-up w-[4px] h-[6px] rounded-full bg-[#B7CFC9]"></span>
<span class="wave-up w-[4px] h-[6px] rounded-full bg-[#B7CFC9]"></span>
<span class="wave-up w-[4px] h-[6px] rounded-full bg-[#B7CFC9]"></span>
<span class="wave-up w-[4px] h-[6px] rounded-full bg-[#B7CFC9]"></span>
<span class="wave-up w-[4px] h-[6px] rounded-full bg-[#B7CFC9]"></span>
<span class="wave-up w-[4px] h-[6px] rounded-full bg-[#B7CFC9]"></span>
<span class="wave-up w-[4px] h-[6px] rounded-full bg-[#B7CFC9]"></span>
<span class="wave-up w-[4px] h-[6px] rounded-full bg-[#B7CFC9]"></span>
<span class="wave-up w-[4px] h-[6px] rounded-full bg-[#B7CFC9]"></span>
</div>
</div>
</div>
<p class="mt-3 text-[16px] leading-relaxed text-[#8A9099]" id="playTip">先听听，觉得不好听可以删掉重录。</p>
</div>
<div class="mt-auto pt-6 pb-5 shrink-0 space-y-3">
<a class="h-[60px] w-full rounded-2xl bg-[#0F8A7E] text-[21px] font-semibold text-white flex items-center justify-center active:bg-[#0B6B62]" href="elder-record.html">
          回到首页
        </a>
<a class="h-[56px] w-full rounded-2xl bg-white border border-[#E8E2D8] text-[19px] font-medium text-[#2C3742] flex items-center justify-center active:bg-[#F4F0E9]" href="elder-calendar.html">
          看看这个月的日历
        </a>
</div>
</div>
</div>
<script>
    var playing = false;

    function togglePlay() {
      playing = !playing;
      var icon = document.getElementById('playIcon');
      var bars = document.querySelectorAll('#waveBox span');
      var tip = document.getElementById('playTip');
      if (playing) {
        icon.setAttribute('icon', 'solar:pause-linear');
        tip.textContent = '正在放你刚才说的话…';
        bars.forEach(function (b, i) {
          b.style.height = (10 + ((i * 7) % 22)) + 'px';
        });
      } else {
        icon.setAttribute('icon', 'solar:play-linear');
        tip.textContent = '先听听，觉得不好听可以删掉重录。';
        bars.forEach(function (b) {
          b.style.height = '6px';
        });
      }
    }
  </script>
</body>
</html>
